# Проверки готовности изменения (AGENTS.md, «Готовность изменения») и выкладка
# сайта.
#
# Один прогон, четыре шага в том же порядке, в каком их гоняют руками. Порядок
# не случаен: линтер и тесты быстрые и ловят большинство, а `npm run build`
# идёт последним, потому что он самый долгий — и самый дотошный. Внутри него
# три валидатора контента и карты стоят до компиляции, поэтому несогласованные
# данные роняют прогон раньше, чем ошибки типов.
#
# Ручной прогон уже дважды поймал то, чего не видят тесты: ошибку типа в
# каталоге, объявленном `as const`, и китайский знак вне подмножества шрифта.
# Здесь это перестаёт зависеть от того, вспомнят ли о проверке.
#
# Выкладка стоит здесь же, а не отдельным файлом, ради одного свойства: на
# сайт уходит ровно тот `dist`, который прошёл проверки. Отдельный файл собирал
# бы заново, и однажды собрал бы не то.

name: Проверки и выкладка

# Только на пуш, и на любую ветку. Отдельного запуска на pull request нет
# намеренно: ветка в этом репозитории своя, её пуш уже проверен, и второй
# прогон на том же коммите ничего не добавил бы. Появятся форки — добавить
# `pull_request` придётся.
on:
  push:
    branches: ['**']

# Новый пуш в ту же ветку отменяет предыдущий прогон: зелёным должен быть
# последний коммит, а не каждый промежуточный. На master отмены нет: очередь
# на уровне файла обрывает весь прогон целиком, вместе с выкладкой. Сайт бы от
# этого не сломался — Pages подменяет его целиком или никак, — но каждый
# коммит master должен быть проверен до конца, а начатая выкладка — доехать.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Проверкам нужно только чтение исходников. Без этой строки токен получает
# права по умолчанию для репозитория — больше, чем им требуется. Право
# публиковать выдаётся ниже одной работе выкладки, а не всему файлу.
permissions:
  contents: read

jobs:
  checks:
    name: Линтер, тесты, сборка
    runs-on: ubuntu-latest

    steps:
      # Действия закреплены по коммиту, а не по подвижному тегу: `v5`
      # переставляют, и прогон однажды взял бы не тот код. Рядом оставлена
      # версия — по ней и обновлять.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Версия берётся из .nvmrc, чтобы она была записана один раз и здесь, и
      # у разработчика. Кэш npm — по package-lock.json.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # Сборка последней: она же и полная проверка контента — validate:map,
      # validate:content и validate:fonts идут до компиляции.
      - run: npm run build

      # Адрес проектного сайта задаёт имя репозитория, а базовый путь записан
      # в vite.config.ts отдельно. Модульные тесты подставляют путь сами и
      # расхождения не увидят: опечатка в `base` или переименованный
      # репозиторий прошли бы все проверки и выложили сайт, который не
      # открывается. Поэтому собранное сверяется с именем репозитория.
      - name: Базовый путь совпадает с именем репозитория
        env:
          BASE: /${{ github.event.repository.name }}/
        run: |
          grep -q "src=\"${BASE}assets/" dist/index.html || {
            echo "::error::dist/index.html собран не под ${BASE} — проверьте base в vite.config.ts"
            exit 1
          }

      # Собранный сайт уходит артефактом, а работа выкладки его забирает. Так
      # на сайт попадает ровно то, что прошло проверки: пересборка в другой
      # работе однажды дала бы другой результат. Только на master — на ветках
      # артефакт никому не нужен, а весит он 16 МБ.
      - if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Выкладка на GitHub Pages
    needs: checks
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    # Права выдаются работе, а не файлу: публиковать разрешено только ей, а
    # проверки остаются с одним чтением. `id-token: write` нужен доверенной
    # выдаче токена, которой Pages убеждается, что артефакт пришёл из этого
    # прогона, а не подложен со стороны.
    permissions:
      pages: write
      id-token: write

    # Своя очередь, общая для всех веток: две выкладки разом заменяли бы
    # содержимое сайта наперегонки, и последней могла бы доехать старая.
    # Начатую не обрываем: сайт обрыв не сломал бы — Pages подменяет его
    # целиком или никак, — но и коммит остался бы невыложенным.
    concurrency:
      group: pages
      cancel-in-progress: false

    # Окружение `github-pages` заводит GitHub сам, когда источником выбран
    # GitHub Actions. Адрес сайта попадёт в сводку прогона.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
